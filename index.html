<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>팔 만들기 💪 데일리 루틴</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d26; --card2:#222632;
    --txt:#f2f4f8; --sub:#9aa3b2; --line:#2c313d;
    --accent:#ff8a3d; --accent2:#ffb072; --ok:#3ddc84; --rest:#5b8cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    line-height:1.5;
  }
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;}
  header h1{font-size:21px;margin:4px 0 2px;font-weight:800;letter-spacing:-.4px;}
  header p{margin:0;color:var(--sub);font-size:13px;}
  .gear{background:var(--card);border:1px solid var(--line);color:var(--txt);
    width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;flex:0 0 auto;margin-top:4px;}

  .days{display:flex;gap:6px;margin:18px 0 16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .days::-webkit-scrollbar{display:none;}
  .day{
    flex:0 0 auto;min-width:42px;text-align:center;padding:9px 0;border-radius:13px;
    background:var(--card);border:1px solid var(--line);color:var(--sub);
    font-size:14px;font-weight:700;cursor:pointer;transition:.15s;
  }
  .day .n{font-size:11px;display:block;color:var(--sub);font-weight:600;margin-bottom:2px;}
  .day.active{background:var(--accent);color:#1a1208;border-color:var(--accent);}
  .day.active .n{color:#7a4a18;}
  .day.today::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent2);margin:3px auto 0;}
  .day.active.today::after{background:#1a1208;}

  .hero{
    background:linear-gradient(135deg,#262a36,#1a1d26);border:1px solid var(--line);
    border-radius:18px;padding:18px;margin-bottom:16px;
  }
  .hero .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent2);
    background:rgba(255,138,61,.12);padding:4px 10px;border-radius:20px;margin-bottom:10px;}
  .hero h2{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.5px;}
  .hero .meta{color:var(--sub);font-size:13px;}

  .rest-box{text-align:center;padding:34px 18px;}
  .rest-box .emo{font-size:46px;}
  .rest-box h2{margin:10px 0 6px;font-size:22px;}
  .rest-box p{color:var(--sub);margin:0;font-size:14px;}

  .note-card{background:rgba(91,140,255,.1);border:1px solid rgba(91,140,255,.3);
    border-radius:13px;padding:11px 13px;margin-bottom:14px;font-size:13px;color:#bcd0ff;}

  .sec-title{font-size:13px;color:var(--sub);font-weight:700;margin:22px 4px 10px;
    text-transform:uppercase;letter-spacing:.5px;}

  .ex{
    background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:14px 14px 12px;margin-bottom:11px;transition:.2s;
  }
  .ex.done{opacity:.55;}
  .ex-head{display:flex;align-items:flex-start;gap:12px;}
  .check{
    flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
    background:transparent;margin-top:2px;cursor:pointer;display:grid;place-items:center;
    font-size:15px;color:transparent;transition:.15s;
  }
  .ex.done .check{background:var(--ok);border-color:var(--ok);color:#0a2316;}
  .ex-body{flex:1;min-width:0;}
  .ex-name{font-weight:700;font-size:16px;margin:0;}
  .ex.done .ex-name{text-decoration:line-through;}
  .ex-sets{color:var(--accent2);font-weight:700;font-size:14px;margin-top:3px;}
  .ex-target{display:inline-block;font-size:11px;color:var(--sub);background:var(--card2);
    padding:2px 8px;border-radius:6px;margin-top:7px;}
  .ex-tip{margin:9px 0 0;font-size:13px;color:var(--sub);background:var(--card2);
    border-radius:9px;padding:9px 11px;border-left:3px solid var(--accent);}

  .how-btn{margin-top:10px;display:inline-flex;align-items:center;gap:5px;background:none;
    border:1px solid var(--line);color:var(--accent2);font-size:13px;font-weight:700;
    padding:7px 12px;border-radius:20px;cursor:pointer;}
  .howto{display:none;margin-top:10px;}
  .howto.open{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;}}
  .howto ol{margin:0;padding-left:20px;}
  .howto li{font-size:13.5px;color:var(--txt);margin-bottom:7px;line-height:1.55;}
  .yt-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    margin-top:10px;padding:11px;border-radius:11px;text-decoration:none;
    background:#ff0033;color:#fff;font-size:14px;font-weight:700;}
  .yt-btn:active{opacity:.85;}

  .progress{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px;
    background:linear-gradient(transparent,var(--bg) 30%);}
  .bar{height:8px;background:var(--card);border-radius:10px;overflow:hidden;}
  .bar > div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:.3s;}
  .ptxt{text-align:center;font-size:13px;color:var(--sub);margin-top:8px;font-weight:600;}
  .done-msg{color:var(--ok);}

  .footnote{color:var(--sub);font-size:12px;text-align:center;margin-top:26px;line-height:1.6;}
  .reset{background:none;border:1px solid var(--line);color:var(--sub);font-size:12px;
    padding:6px 14px;border-radius:20px;cursor:pointer;margin-top:10px;}

  /* ===== 설정 오버레이 ===== */
  .overlay{position:fixed;inset:0;background:rgba(8,9,12,.75);backdrop-filter:blur(4px);
    display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .sheet{background:var(--bg);border-top-left-radius:22px;border-top-right-radius:22px;
    border:1px solid var(--line);width:100%;max-width:520px;padding:20px 18px 30px;
    max-height:90vh;overflow-y:auto;animation:up .25s ease;}
  @keyframes up{from{transform:translateY(40px);opacity:.4;}to{transform:none;opacity:1;}}
  .sheet h2{margin:2px 0 4px;font-size:20px;font-weight:800;}
  .sheet .sub{color:var(--sub);font-size:13px;margin:0 0 18px;}
  .field{margin-bottom:18px;}
  .field > label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:9px;}
  .opts{display:flex;gap:8px;flex-wrap:wrap;}
  .opt{flex:1;min-width:70px;text-align:center;padding:12px 8px;border-radius:13px;
    background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:14px;
    font-weight:600;cursor:pointer;transition:.15s;}
  .opt small{display:block;color:var(--sub);font-size:11px;font-weight:500;margin-top:2px;}
  .opt.sel{background:var(--accent);color:#1a1208;border-color:var(--accent);}
  .opt.sel small{color:#7a4a18;}
  .age-row{display:flex;align-items:center;gap:12px;}
  .age-row input{flex:1;}
  .age-val{font-weight:800;font-size:18px;min-width:54px;text-align:right;}
  input[type=range]{accent-color:var(--accent);height:30px;}
  .save{width:100%;padding:15px;border:none;border-radius:14px;background:var(--accent);
    color:#1a1208;font-size:16px;font-weight:800;cursor:pointer;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <header>
      <h1>💪 팔 만들기 데일리</h1>
      <p id="subline">초보 · 1kg 아령 + 밴드</p>
    </header>
    <button class="gear" id="gear" aria-label="설정">⚙️</button>
  </div>

  <div class="days" id="days"></div>
  <div id="content"></div>

  <div class="progress" id="progress" style="display:none">
    <div class="bar"><div id="barFill"></div></div>
    <div class="ptxt" id="ptxt"></div>
  </div>

  <div class="footnote">
    가벼운 무게는 <b>천천히(2초 올리고 2초 내리고)</b> 하는 게 핵심이야.<br>
    통증이 있으면 멈추고, 운동 사이 1분씩 쉬어.<br>
    <button class="reset" id="reset">오늘 체크 초기화</button>
  </div>
</div>

<!-- 설정 시트 -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>내 정보 설정 ⚙️</h2>
    <p class="sub">입력값은 이 폰에만 저장돼요. 서버로 안 보냅니다.</p>

    <div class="field">
      <label>성별</label>
      <div class="opts" data-key="sex">
        <div class="opt" data-v="female">여성</div>
        <div class="opt" data-v="male">남성</div>
        <div class="opt" data-v="none">선택 안 함</div>
      </div>
    </div>

    <div class="field">
      <label>나이</label>
      <div class="age-row">
        <input type="range" id="age" min="14" max="75" step="1">
        <span class="age-val" id="ageVal">30세</span>
      </div>
    </div>

    <div class="field">
      <label>목표</label>
      <div class="opts" data-key="goal">
        <div class="opt" data-v="line">탄탄한 라인<small>고반복·날씬한 팔</small></div>
        <div class="opt" data-v="size">알통 키우기<small>근육 사이즈</small></div>
      </div>
    </div>

    <div class="field">
      <label>운동 빈도</label>
      <div class="opts" data-key="freq">
        <div class="opt" data-v="3">주 3일<small>팔 전체</small></div>
        <div class="opt" data-v="4">주 4일<small>분할</small></div>
        <div class="opt" data-v="5">주 5일<small>분할+서킷</small></div>
      </div>
    </div>

    <button class="save" id="save">저장하고 시작 💪</button>
  </div>
</div>

<script>
/* ============ 동작 풀 (목표에 따라 반복수 자동 변경) ============ */
// reps: {line:"탄탄한 라인", size:"알통 키우기"}
const E = {
  curl:        {n:"덤벨 컬", t:"이두", tip:"팔꿈치를 옆구리에 고정! 반동 쓰지 말고 천천히.", reps:{line:"3세트 × 18회",size:"4세트 × 12회"},
                how:["아령을 양손에 들고 차렷 자세로 선다 (손바닥이 앞을 향함).","팔꿈치를 옆구리에 붙여 고정한 채, 아령을 어깨 높이까지 천천히 올린다.","2초에 걸쳐 천천히 내린다. 어깨·허리 반동은 쓰지 않는다."]},
  bandCurl:    {n:"밴드 컬", t:"이두", tip:"밴드 밟고 서서 당겨. 끝까지 긴장감 줘서 펌핑 잘 됨.", reps:{line:"3세트 × 20회",size:"4세트 × 15회"},
                how:["밴드 가운데를 양발로 밟고 양 끝을 손에 잡는다.","팔꿈치를 옆구리에 고정하고 손을 어깨까지 당겨 올린다.","천천히 내리되 맨 아래에서도 밴드 긴장을 풀지 않는다."]},
  hammer:      {n:"해머 컬", t:"이두/전완", tip:"엄지가 위로 가게 잡고. 망치 들듯이.", reps:{line:"3세트 × 18회",size:"4세트 × 12회"},
                how:["아령을 엄지가 위로 가게(세로로) 잡고 선다.","망치질하듯 팔꿈치를 고정한 채 어깨 쪽으로 올린다.","천천히 시작 위치로 내린다."]},
  concentr:    {n:"컨센트레이션 컬", t:"이두", tip:"앉아서 팔꿈치를 허벅지 안쪽에 대고 한 팔씩. 알통 정점 자극.", reps:{line:"3세트 × 15회",size:"4세트 × 10회"},
                how:["벤치/의자에 앉아 다리를 벌리고 한 손에 아령을 든다.","팔꿈치를 같은 쪽 허벅지 안쪽에 대 고정한다.","아령을 천천히 올렸다 내린다. 한쪽 끝나면 반대팔 반복."]},
  wristCurl:   {n:"리스트 컬", t:"전완", tip:"손바닥 위로, 손목만 까딱까딱. 앞팔 두꺼워지는 운동.", reps:{line:"3세트 × 20회",size:"3세트 × 15회"},
                how:["앉아서 팔뚝을 허벅지 위에 올리고 손바닥이 위를 향하게 한다.","손목만 사용해 아령을 위로 말아 올린다.","천천히 손목을 아래로 내린다. 팔뚝은 움직이지 않는다."]},
  revCurl:     {n:"역방향 컬", t:"전완", tip:"손등이 위로 오게 잡고 컬. 앞팔 윗부분.", reps:{line:"3세트 × 18회",size:"3세트 × 12회"},
                how:["아령을 손등이 위로 오게(오버핸드) 잡고 선다.","팔꿈치를 고정하고 손등 방향으로 어깨까지 올린다.","천천히 내린다. 일반 컬보다 무겁게 느껴지니 천천히."]},
  overhead:    {n:"오버헤드 익스텐션", t:"삼두", tip:"아령 양손으로 머리 뒤로. 팔꿈치 고정하고 위로만.", reps:{line:"3세트 × 18회",size:"4세트 × 12회"},
                how:["아령 하나를 양손으로 감싸 잡고 머리 위로 곧게 든다.","팔꿈치 위치를 고정한 채 아령을 머리 뒤로 천천히 내린다.","팔을 펴 다시 머리 위로 올린다. 팔꿈치가 벌어지지 않게."]},
  kickback:    {n:"덤벨 킥백", t:"삼두", tip:"상체 숙이고 팔 뒤로 쭉. 팔 뒤쪽 흔들리는 살에 직빵.", reps:{line:"3세트 × 18회",size:"4세트 × 12회"},
                how:["상체를 앞으로 45도 숙이고 팔꿈치를 90도로 들어 옆구리에 붙인다.","팔꿈치 위치를 고정한 채 아래팔만 뒤로 쭉 편다.","천천히 90도로 돌아온다. 팔이 흔들리지 않게."]},
  pushdown:    {n:"밴드 푸시다운", t:"삼두", tip:"문 위에 밴드 걸고 아래로 눌러. 팔꿈치 붙이고.", reps:{line:"3세트 × 20회",size:"4세트 × 15회"},
                how:["밴드를 문 위쪽 등 높은 곳에 걸고 양 끝을 잡는다.","팔꿈치를 옆구리에 붙인 채 밴드를 아래로 쭉 누른다.","천천히 위로 올라온다. 팔꿈치는 계속 붙여둔다."]},
  kneePush:    {n:"무릎 푸시업", t:"삼두/가슴", tip:"손 좁게 짚으면 삼두에 더 들어가. 힘들면 무릎 대고.", reps:{line:"3세트 × 12회",size:"4세트 × 8회"},
                how:["무릎을 바닥에 대고 엎드린다. 손은 어깨너비(삼두 강조 시 약간 좁게).","가슴이 바닥에 가까워지도록 팔꿈치를 굽혀 내려간다.","바닥을 밀어 올라온다. 허리가 꺾이지 않게 배에 힘."]},
  lateral:     {n:"사이드 레터럴 레이즈", t:"어깨", tip:"양옆으로 어깨 높이까지. 어깨 둥글게 만들어줌.", reps:{line:"3세트 × 18회",size:"4세트 × 12회"},
                how:["아령을 양손에 들고 차렷 자세로 선다.","팔꿈치를 살짝 굽힌 채 양옆으로 어깨 높이까지 든다.","천천히 내린다. 어깨를 으쓱하지 말고 옆으로만."]},
  front:       {n:"프론트 레이즈", t:"어깨", tip:"앞으로 어깨 높이까지 들기. 천천히 내리기.", reps:{line:"3세트 × 18회",size:"4세트 × 12회"},
                how:["아령을 허벅지 앞에 두고 선다 (손등이 앞을 향함).","팔을 앞으로 들어 어깨 높이까지 올린다.","천천히 내린다. 반동 없이 한쪽씩 번갈아 해도 좋다."]},
  pullApart:   {n:"밴드 풀어파트", t:"어깨/등", tip:"밴드 가슴 앞에서 양옆으로 쫙. 자세 교정 + 뒤어깨.", reps:{line:"3세트 × 20회",size:"3세트 × 15회"},
                how:["밴드를 어깨너비 정도로 잡고 가슴 앞에서 팔을 편다.","가슴을 펴며 밴드를 양옆으로 당겨 벌린다 (날개뼈 모으기).","천천히 시작 위치로 돌아온다."]},
  shoulderP:   {n:"숄더 프레스", t:"어깨", tip:"아령을 어깨에서 머리 위로. 어깨 전체.", reps:{line:"3세트 × 15회",size:"4세트 × 10회"},
                how:["아령을 어깨 높이에 든다 (손바닥이 앞을 향함).","머리 위로 곧게 밀어 올린다. 허리를 젖히지 않는다.","천천히 어깨 높이로 내린다."]}
};

/* ============ 세션 정의 ============ */
const SESS = {
  // 주3일용: 매번 팔 전체, 강조점만 다름
  FULL_BI:  {title:"팔 전체 · 이두 강조", subtitle:"알통 위주 + 어깨", warmup:"팔 돌리기 20초 + 손목 돌리기 20초",
             ex:["curl","hammer","bandCurl","overhead","lateral"]},
  FULL_TRI: {title:"팔 전체 · 삼두 강조", subtitle:"팔뒤 위주 + 어깨", warmup:"어깨 으쓱 20초 + 팔 뒤 스트레칭",
             ex:["overhead","kickback","pushdown","curl","lateral"]},
  FULL_BAL: {title:"팔 전체 · 균형 펌핑", subtitle:"골고루 + 전완/어깨", warmup:"제자리 걷기 1분",
             ex:["curl","kickback","lateral","wristCurl","pullApart"]},
  // 주4·5일용: 분할
  BI_A:  {title:"이두 + 전완", subtitle:"알통·앞팔 집중", warmup:"팔 돌리기 20초 + 손목 돌리기 20초",
          ex:["curl","bandCurl","hammer","wristCurl"]},
  TRI_A: {title:"삼두 + 어깨", subtitle:"팔뒤·어깨 라인", warmup:"어깨 으쓱 20초 + 팔 뒤 스트레칭",
          ex:["overhead","kickback","pushdown","lateral"]},
  BI_B:  {title:"이두 + 전완 (변형)", subtitle:"각도 바꿔 자극", warmup:"팔 돌리기 20초 + 손목 돌리기 20초",
          ex:["concentr","bandCurl","revCurl","wristCurl"]},
  TRI_B: {title:"삼두 + 어깨 (변형)", subtitle:"각도 바꿔 자극", warmup:"어깨 으쓱 20초 + 팔 스트레칭",
          ex:["kneePush","overhead","front","pullApart"]},
  CIRCUIT:{title:"팔 전체 펌핑 서킷", subtitle:"가볍게 빠르게 순환", warmup:"제자리 걷기 1분",
          ex:["curl","kickback","lateral","shoulderP","pullApart"]}
};

/* ============ 빈도별 주간 스케줄 (0=일 ~ 6=토) ============ */
const SCHED = {
  3:{0:"rest",1:"FULL_BI",2:"rest",3:"FULL_TRI",4:"rest",5:"FULL_BAL",6:"active"},
  4:{0:"rest",1:"BI_A",2:"TRI_A",3:"rest",4:"BI_B",5:"TRI_B",6:"active"},
  5:{0:"rest",1:"BI_A",2:"TRI_A",3:"rest",4:"BI_B",5:"TRI_B",6:"CIRCUIT"}
};

/* ============ 설정 저장/로드 ============ */
const DEF = {sex:"female", age:30, goal:"line", freq:"3"};
function loadCfg(){ try{return {...DEF, ...JSON.parse(localStorage.getItem("arm-cfg")||"{}")};}catch(e){return {...DEF};} }
function saveCfg(c){ localStorage.setItem("arm-cfg", JSON.stringify(c)); }
let cfg = loadCfg();

/* ============ 메인 렌더 ============ */
const DAY_NAMES=["일","월","화","수","목","금","토"];
let viewDay = new Date().getDay();
const todayIdx = new Date().getDay();

function storeKey(d){
  const t=new Date();
  return `arm-${t.getFullYear()}-${t.getMonth()}-${t.getDate()}-d${d}`;
}

// 해당 요일의 실제 플랜 객체 만들기
function planFor(day){
  const code = SCHED[cfg.freq][day];
  if(code==="rest") return {type:"rest", title:"완전 휴식", emo:"😴", note:"근육은 쉴 때 자라. 푹 쉬고 스트레칭만 가볍게!"};
  if(code==="active") return {type:"active", title:"가벼운 회복 + 스트레칭", emo:"🧘",
       note:"밴드 풀어파트 2세트 × 15회만 가볍게 + 팔/어깨 스트레칭 5분. 무리하지 말기!"};
  const s = SESS[code];
  return {type:"work", title:s.title, subtitle:s.subtitle, warmup:s.warmup,
          ex:s.ex.map(k=>{const e=E[k];return {n:e.n,t:e.t,tip:e.tip,s:e.reps[cfg.goal],how:e.how};})};
}

function ageNote(){
  if(cfg.age>=50) return "💡 50대 이상: 워밍업 1분 더, 세트 사이 휴식을 넉넉히(1분30초) 가져가세요.";
  if(cfg.age>=40) return "💡 40대: 관절 보호를 위해 워밍업 충분히 하고 천천히 진행하세요.";
  if(cfg.age<=18) return "💡 성장기엔 무리한 고중량보다 바른 자세와 꾸준함이 더 중요해요.";
  return "";
}

function renderDays(){
  const box=document.getElementById("days");
  box.innerHTML="";
  DAY_NAMES.forEach((nm,i)=>{
    const p=planFor(i);
    const el=document.createElement("div");
    el.className="day"+(i===viewDay?" active":"")+(i===todayIdx?" today":"");
    el.innerHTML=`<span class="n">${nm}</span>${p.type==="rest"?"휴":p.type==="active"?"회":"💪"}`;
    el.onclick=()=>{viewDay=i;render();};
    box.appendChild(el);
  });
}

function render(){
  // 서브라인 갱신
  const goalTxt = cfg.goal==="line"?"탄탄한 라인":"알통 키우기";
  document.getElementById("subline").textContent = `초보 · 1kg 아령 + 밴드 · ${goalTxt} · 주${cfg.freq}일`;

  renderDays();
  const p=planFor(viewDay);
  const c=document.getElementById("content");
  const prog=document.getElementById("progress");

  if(p.type!=="work"){
    prog.style.display="none";
    c.innerHTML=`<div class="hero rest-box">
      <div class="emo">${p.emo}</div>
      <h2>${p.title}</h2>
      <p>${p.note}</p>
    </div>`;
    return;
  }

  const isToday = viewDay===todayIdx;
  let html=`<div class="hero">
    <span class="tag">${isToday?"오늘의 운동":DAY_NAMES[viewDay]+"요일 운동"}</span>
    <h2>${p.title}</h2>
    <div class="meta">${p.subtitle} · 총 ${p.ex.length}개 동작</div>
  </div>`;

  const an=ageNote();
  if(an) html+=`<div class="note-card">${an}</div>`;

  html+=`<div class="ex" style="border-style:dashed">
    <div class="ex-body"><p class="ex-name">🔥 워밍업</p>
    <p class="ex-tip" style="margin-top:7px">${p.warmup}</p></div></div>`;

  html+=`<div class="sec-title">운동 (세트 끝나면 체크)</div>`;
  p.ex.forEach((e,i)=>{
    const done=localStorage.getItem(storeKey(viewDay)+"-"+i)==="1";
    const steps=(e.how||[]).map(s=>`<li>${s}</li>`).join("");
    const ytURL="https://www.youtube.com/results?search_query="+encodeURIComponent(e.n+" 운동 방법");
    html+=`<div class="ex ${done?"done":""}" data-i="${i}">
      <div class="ex-head">
        <button class="check">✓</button>
        <div class="ex-body">
          <p class="ex-name">${e.n}</p>
          <div class="ex-sets">${e.s}</div>
          <span class="ex-target">${e.t}</span>
          <p class="ex-tip">${e.tip}</p>
          <button class="how-btn">📖 방법 보기 ▾</button>
          <div class="howto">
            <ol>${steps}</ol>
            <a class="yt-btn" href="${ytURL}" target="_blank" rel="noopener">▶ 영상으로 보기 (유튜브)</a>
          </div>
        </div>
      </div>
    </div>`;
  });
  c.innerHTML=html;

  c.querySelectorAll(".ex[data-i]").forEach(el=>{
    el.querySelector(".check").onclick=()=>{
      const i=el.dataset.i;
      const k=storeKey(viewDay)+"-"+i;
      const now=localStorage.getItem(k)==="1";
      localStorage.setItem(k, now?"0":"1");
      render();
    };
    const hb=el.querySelector(".how-btn"), ho=el.querySelector(".howto");
    if(hb&&ho){
      hb.onclick=(ev)=>{
        ev.stopPropagation();
        const open=ho.classList.toggle("open");
        hb.textContent = open ? "📖 방법 닫기 ▴" : "📖 방법 보기 ▾";
      };
    }
  });

  prog.style.display="block";
  updateProgress(p);
}

function updateProgress(p){
  let done=0;
  p.ex.forEach((e,i)=>{ if(localStorage.getItem(storeKey(viewDay)+"-"+i)==="1") done++; });
  const pct=Math.round(done/p.ex.length*100);
  document.getElementById("barFill").style.width=pct+"%";
  const t=document.getElementById("ptxt");
  if(pct===100){ t.innerHTML=`<span class="done-msg">🎉 오늘 운동 끝! 수고했어 💪</span>`; }
  else { t.textContent=`${done} / ${p.ex.length} 완료 (${pct}%)`; }
}

document.getElementById("reset").onclick=()=>{
  const p=planFor(viewDay);
  if(p.type!=="work") return;
  p.ex.forEach((e,i)=>localStorage.removeItem(storeKey(viewDay)+"-"+i));
  render();
};

/* ============ 설정 시트 동작 ============ */
const overlay=document.getElementById("overlay");
function openSheet(){
  // 현재 cfg를 UI에 반영
  document.querySelectorAll('.opts').forEach(g=>{
    const key=g.dataset.key;
    g.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.dataset.v===String(cfg[key])));
  });
  document.getElementById("age").value=cfg.age;
  document.getElementById("ageVal").textContent=cfg.age+"세";
  overlay.classList.add("show");
}
document.getElementById("gear").onclick=openSheet;

document.querySelectorAll('.opts').forEach(g=>{
  g.querySelectorAll('.opt').forEach(o=>{
    o.onclick=()=>{ g.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); };
  });
});
document.getElementById("age").oninput=(e)=>{ document.getElementById("ageVal").textContent=e.target.value+"세"; };

document.getElementById("save").onclick=()=>{
  document.querySelectorAll('.opts').forEach(g=>{
    const sel=g.querySelector('.opt.sel');
    if(sel) cfg[g.dataset.key]=sel.dataset.v;
  });
  cfg.age=parseInt(document.getElementById("age").value,10);
  saveCfg(cfg);
  overlay.classList.remove("show");
  render();
};
overlay.onclick=(e)=>{ if(e.target===overlay) overlay.classList.remove("show"); };

/* 첫 방문이면 설정 시트 먼저 띄우기 */
if(!localStorage.getItem("arm-cfg")) openSheet();

render();
</script>
</body>
</html>
